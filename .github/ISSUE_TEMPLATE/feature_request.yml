name: Feature request
description: Suggest an improvement to Unloopr without sharing private information
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Search existing open and closed issues first. This issue is public. Do not include secrets, customer records, private source code or personal data.
  - type: dropdown
    id: surface
    attributes:
      label: Which part of Unloopr?
      description: Choose the actual tool you use. Most engineering roles are not public hosted services. Leave as Other / not sure if unsure.
      options:
        - Free website scan
        - Authenticated MCP client
        - GitHub App
        - Handroll Rehab (local audit)
        - Lego Builder (research-first engineering)
        - Overwrite Guard (opt-in local / CI)
        - AgentGit (engineering)
        - StateLayer (internal preview)
        - Sweepr (inside AgentGit)
        - Other / not sure
    validations:
      required: false
  - type: textarea
    id: need
    attributes:
      label: What are you trying to accomplish?
      description: Describe the user problem before proposing a solution
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should the product do?
      description: Expected behavior or the result you need
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workaround (optional)
      description: Include only public, sanitized details
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-safety confirmation
      options:
        - label: I have removed credentials, private source code and customer or account information
          required: true
