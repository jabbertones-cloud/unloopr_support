name: Bug report
description: Report a reproducible Unloopr or Unloopr MCP defect
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Never paste private repository contents, access tokens, passwords or secrets.
  - type: dropdown
    id: surface
    attributes:
      label: Which part of Unloopr?
      description: Choose the actual tool you use. Most engineering roles are not public hosted services. Leave as Other / not sure if unsure.
      options:
        - Free website scan
        - Authenticated MCP client
        - GitHub App
        - Handroll Rehab (local audit)
        - Lego Builder (research-first engineering)
        - Overwrite Guard (opt-in local / CI)
        - AgentGit (engineering)
        - StateLayer (internal preview)
        - Sweepr (inside AgentGit)
        - Other / not sure
    validations:
      required: false
  - type: textarea
    id: symptom
    attributes:
      label: What broke?
      description: What happened and which Unloopr feature or MCP tool was involved?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Steps that do not reveal private code or customer data
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Unloopr and MCP client version
  - type: checkboxes
    id: safety
    attributes:
      label: Public report safety
      options:
        - label: This report contains no secrets, private source code or sensitive data
          required: true
